name: Tests

on:
  push:
    branches:
      - main
      - ng
  pull_request:
    branches:
      - main
      - ng

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements_lint.txt
      # Validate this paired sync against its immutable library candidate.
      # Production requirements remain pinned to the last published wheel.
      - name: Install paired library candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'sync/upstream-20261016'
        run: pip install --no-deps 'git+https://github.com/Zensqrl/ha-garmin.git@462ed70377f55b90c6a9029f0d8230ca5d6bf56d'
      - run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements_lint.txt
      - name: Install paired library candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'sync/upstream-20261016'
        run: pip install --no-deps 'git+https://github.com/Zensqrl/ha-garmin.git@462ed70377f55b90c6a9029f0d8230ca5d6bf56d'
      - run: pytest tests/ -q
